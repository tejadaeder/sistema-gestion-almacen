<table mat-table [dataSource]="dataSource" class="mat-elevation-z8" style="width: 100%;">
  
  <!-- Columna Código -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> Código </th>
    <td mat-cell *matCellDef="let prod"> <strong>{{ prod.id }}</strong> </td>
  </ng-container>

  <!-- Columna Nombre -->
  <ng-container matColumnDef="nombre">
    <th mat-header-cell *matHeaderCellDef> Nombre </th>
    <td mat-cell *matCellDef="let prod"> {{ prod.nombre }} </td>
  </ng-container>

  <!-- Columna Categoría (Usando MatChips para que se vea moderno) -->
  <ng-container matColumnDef="categoria">
    <th mat-header-cell *matHeaderCellDef> Categoría </th>
    <td mat-cell *matCellDef="let prod"> 
      <mat-chip>{{ prod.categoria }}</mat-chip>
    </td>
  </ng-container>

  <!-- Columna Stock -->
  <ng-container matColumnDef="stock">
    <th mat-header-cell *matHeaderCellDef> Stock </th>
    <td mat-cell *matCellDef="let prod" [style.color]="prod.stock < 20 ? 'red' : 'green'"> 
      <strong>{{ prod.stock }} unid.</strong> 
    </td>
  </ng-container>

  <ng-container matColumnDef="precio">
    <th mat-header-cell *matHeaderCellDef> Precio </th>
    <td mat-cell *matCellDef="let prod"> 
      <strong>{{ prod.precio }} S/.</strong> 
    </td>
  </ng-container>

  <ng-container matColumnDef="valor_inventario">
    <th mat-header-cell *matHeaderCellDef> Valor de Inventario </th>
    <td mat-cell *matCellDef="let prod"> 
      <strong>{{ prod.valor_inventario }} S/.</strong> 
    </td>
  </ng-container>


  <!-- Columna Acciones -->
  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef> Acciones </th>
    <td mat-cell *matCellDef="let prod">
      <button
        mat-raised-button
        color="primary"
        [routerLink]="['/detalle-producto', prod.id]"
        [state]="{ producto: prod }">
        Ver Detalle
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columnas"></tr>
  <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
</table>
